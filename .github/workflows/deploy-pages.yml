name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "outputs/dashboard-v1/**"
      - "outputs/dashboard-v2/**"
      - "outputs/dashboard-v4/**"
      - "outputs/index.html"
      - "docs/**"
      - "tools/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dashboard v4 dependencies
        working-directory: ./outputs/dashboard-v4
        run: pnpm install --frozen-lockfile

      - name: Build dashboard v4
        working-directory: ./outputs/dashboard-v4
        run: pnpm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p pages-site
          cp outputs/index.html pages-site/index.html
          cp -R outputs/dashboard-v1 pages-site/dashboard-v1
          cp -R outputs/dashboard-v2 pages-site/dashboard-v2
          cp -R outputs/dashboard-v4/dist/client pages-site/dashboard-v4

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./pages-site"

      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
